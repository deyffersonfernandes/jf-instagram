name: Telegram do CMO

# A cada 5 minutos lê as mensagens novas que o José mandou para o bot (texto,
# áudio, print, vídeo) e guarda em inbox/ para o CMO. Quando o CMO deixa algo
# em outbox/ (push), manda para o José no Telegram.

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "outbox/**"
  workflow_dispatch:

concurrency:
  group: telegram-cmo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: whisper-small-v1

      - name: Configurar git e ramo de mídia
        run: |
          git config user.name "jf-instagram-bot"
          git config user.email "jf-instagram-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin midia >/dev/null; then
            git fetch -q origin midia:midia
            git worktree add -q _midia midia
          else
            git worktree add -q --orphan -b midia _midia 2>/dev/null || { git worktree add -q --detach _midia && cd _midia && git checkout -q --orphan midia && git rm -rqf . || true; }
          fi

      - name: Instalar dependências
        run: pip install --quiet cryptography

      - name: Enviar mensagens do CMO
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_bot.py enviar

      - name: Receber mensagens do José
        if: github.event_name != 'push'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_bot.py receber

      - name: Salvar
        run: |
          cd _midia
          git add -A .
          if ! git diff --cached --quiet; then
            git commit -qm "Mídia do Telegram"
            for i in 1 2 3; do git push -q origin midia && break; sleep 3; done
          fi
          cd ..
          git add -A inbox outbox telegram
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -qm "Telegram: caixa do CMO"
          for i in 1 2 3 4; do
            git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
