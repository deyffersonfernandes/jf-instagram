name: Telegram do CMO

# Fica ouvindo o bot do Telegram o tempo todo (cada execução escuta 55 minutos e a
# próxima entra na fila): guarda cada mensagem do José (cifrada), aciona o CMO na
# hora pela API da rotina (segredo CMO_FIRE_TOKEN) e manda as respostas do CMO
# (outbox/). Sem o segredo, guarda e o CMO responde na rotina de hora em hora.

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - "outbox/**"
  workflow_dispatch:

concurrency:
  group: telegram-cmo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: whisper-small-v1

      - name: Configurar git e ramo de mídia
        run: |
          git config user.name "jf-instagram-bot"
          git config user.email "jf-instagram-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin midia >/dev/null; then
            git fetch -q origin midia:midia
            git worktree add -q _midia midia
          else
            git worktree add -q --orphan -b midia _midia 2>/dev/null || { git worktree add -q --detach _midia && cd _midia && git checkout -q --orphan midia && git rm -rqf . || true; }
          fi

      - name: Instalar dependências
        run: pip install --quiet cryptography

      - name: Escutar o Telegram e acionar o CMO
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CMO_FIRE_TOKEN: ${{ secrets.CMO_FIRE_TOKEN }}
        run: python telegram_bot.py escutar 55

      - name: Salvar
        run: |
          cd _midia
          git add -A .
          if ! git diff --cached --quiet; then
            git commit -qm "Mídia do Telegram"
            for i in 1 2 3; do git push -q origin midia && break; sleep 3; done
          fi
          cd ..
          git add -A inbox outbox telegram
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -qm "Telegram: caixa do CMO"
          for i in 1 2 3 4; do
            git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
