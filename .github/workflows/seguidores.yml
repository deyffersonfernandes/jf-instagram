name: Ler seguidores do Instagram

on:
  schedule:
    - cron: "17,47 * * * *"   # a cada 30 minutos
  workflow_dispatch:

concurrency:
  group: seguidores-instagram
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ler seguidores pela API do Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GRAPH_HOST: ${{ secrets.GRAPH_HOST }}
          GRAPH_VERSION: ${{ secrets.GRAPH_VERSION }}
        run: python seguidores.py

      - name: Salvar no repositório (só se o número mudou)
        run: |
          git config user.name "jf-instagram-bot"
          git config user.email "jf-instagram-bot@users.noreply.github.com"
          if git diff --quiet -- seguidores.json 2>/dev/null && git ls-files --error-unmatch seguidores.json >/dev/null 2>&1; then
            echo "Número igual, nada a salvar."
            exit 0
          fi
          if git ls-files --error-unmatch seguidores.json >/dev/null 2>&1; then
            ANTES=$(git show HEAD:seguidores.json | python -c "import json,sys;print(json.load(sys.stdin).get('seguidores'))")
            DEPOIS=$(python -c "import json;print(json.load(open('seguidores.json'))['seguidores'])")
            if [ "$ANTES" = "$DEPOIS" ]; then
              git checkout -- seguidores.json
              echo "Número igual ($DEPOIS), nada a salvar."
              exit 0
            fi
          fi
          git add seguidores.json
          git commit -m "Seguidores: $(python -c "import json;print(json.load(open('seguidores.json'))['seguidores'])")"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep 7
          done
          exit 1
