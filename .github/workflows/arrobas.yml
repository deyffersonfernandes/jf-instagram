name: Checar arrobas no Instagram

on:
  push:
    branches: [main]
    paths: ["pedidos/arrobas.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checar cada arroba
        env:
          GH_REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          out=$RUNNER_TEMP/arrobas; mkdir -p $out
          echo "arroba,web_profile_info,pagina" > $out/resultado.csv
          for h in $(sort -u pedidos/arrobas.txt); do
            a=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" \
                -H "x-ig-app-id: 936619743392459" "https://i.instagram.com/api/v1/users/web_profile_info/?username=$h")
            b=$(curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0 Safari/537.36" "https://www.instagram.com/$h/" | grep -o -m1 '"username":"[^"]*"\|Page Not Found\|Esta página não está disponível\|Sorry, this page' | head -1 | tr ',' ' ')
            echo "$h,$a,$b" >> $out/resultado.csv
            sleep 3
          done
          cat $out/resultado.csv
          cd $out && git init -q && git config user.name bot && git config user.email bot@users.noreply.github.com && git checkout -q -b arrobas && git add -A && git commit -qm arrobas && git push -q -f "$GH_REPO_URL" arrobas
