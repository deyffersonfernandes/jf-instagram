name: Buscar vídeo para Reels de meme

# A tarefa do Claude grava pedidos/meme/<id>.json e dá push. Este workflow
# (que tem internet livre) procura vídeos de uso livre, baixa os candidatos
# já cortados e devolve tudo no ramo meme/<id>, de onde a tarefa escolhe o
# melhor trecho, monta o Reels e coloca na Central.

on:
  push:
    branches: [main]
    paths:
      - "pedidos/meme/*.json"
  workflow_dispatch:

concurrency:
  group: meme-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install --quiet pillow
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi

      - name: Apagar ramos meme/<id> de pedidos já concluídos
        env:
          GH_REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          for b in $(git ls-remote --heads "$GH_REPO_URL" 'meme/*' | awk '{print $2}' | sed 's#refs/heads/##'); do
            id=${b#meme/}
            if [ ! -f "pedidos/meme/$id.json" ]; then git push -q "$GH_REPO_URL" --delete "$b" || true; fi
          done

      - name: Buscar candidatos e devolver no ramo meme/<id>
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GH_REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pedidos=$(ls pedidos/meme/*.json 2>/dev/null || true)
          else
            pedidos=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'pedidos/meme/*.json' || ls pedidos/meme/*.json)
          fi
          for p in $pedidos; do
            [ -f "$p" ] || continue
            id=$(basename "$p" .json)
            echo "::group::$id"
            out="$RUNNER_TEMP/meme-$id"
            rm -rf "$out"; mkdir -p "$out"
            python meme.py buscar "$p" "$out" || echo '{"ok": false, "erros": ["falha no script de busca"]}' > "$out/resultado.json"
            cp "$p" "$out/pedido.json"
            ( cd "$out"
              git init -q
              git config user.name "jf-instagram-bot"
              git config user.email "jf-instagram-bot@users.noreply.github.com"
              git checkout -q -b "meme/$id"
              git add -A
              git commit -qm "Candidatos para o meme $id"
              git push -q -f "$GH_REPO_URL" "meme/$id" )
            echo "::endgroup::"
          done
