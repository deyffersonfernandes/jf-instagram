name: Publicar no Instagram

on:
  schedule:
    - cron: "*/10 * * * *"    # confere a fila a cada 10 minutos
  push:
    paths:
      - "fila/**"
  workflow_dispatch:

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar posts com horário vencido
        id: pub
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GRAPH_HOST: ${{ secrets.GRAPH_HOST }}
          GRAPH_VERSION: ${{ secrets.GRAPH_VERSION }}
        run: python publicar.py

      - name: Registrar resultado no repositório
        if: always()
        run: |
          git config user.name "jf-instagram-bot"
          git config user.email "jf-instagram-bot@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -m "Atualiza fila de publicação"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
